<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>binbook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the theme picked in the sidebar before first paint (see themes.ts).
      try {
        const theme = localStorage.getItem('binbook:theme')
        if (theme && theme !== 'system') {
          document.documentElement.dataset.theme = theme
        }
      } catch {
        /* storage blocked: follow the OS */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
