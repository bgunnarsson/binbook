<style>
  .btn {
    --btn-bg: #5b5bd6;
    --btn-fg: #ffffff;
    --btn-border: transparent;
    font: 600 14px/1 system-ui, sans-serif;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid var(--btn-border);
    background: var(--btn-bg);
    color: var(--btn-fg);
    cursor: pointer;
    transition: filter .15s ease, transform .05s ease;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .5; cursor: not-allowed; filter: none; }
  .btn--primary   { --btn-bg: #5b5bd6; }
  .btn--secondary { --btn-bg: #eef0ff; --btn-fg: #4744c9; --btn-border: #d6d8f5; }
  .btn--ghost     { --btn-bg: transparent; --btn-fg: #5b5bd6; --btn-border: #5b5bd6; }
  .btn--danger    { --btn-bg: #e5484d; }
  .btn--sm { padding: 6px 12px; font-size: 12px; border-radius: 6px; }
  .btn--lg { padding: 14px 22px; font-size: 16px; border-radius: 10px; }
</style>
<button class="btn btn--{{variant}} btn--{{size}}" {{disabled}}>{{label}}</button>
